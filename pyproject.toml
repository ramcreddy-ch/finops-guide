[project]
name = "finops-guide"
version = "0.1.0"
description = "Real-time FinOps cost management platform for multi-cloud environments"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
finops = "finops.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
